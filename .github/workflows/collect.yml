# 3시간마다 디스코드 시세를 가져와 data/ 에 저장하는 자동 작업
name: 시세 수집

on:
  schedule:
    # 상점 갱신(한국 0·3·6…21시 = UTC 15·18·21·0…12시) 7분 뒤, 혹시 밀릴 때를 대비해 37분 뒤에 한 번 더
    - cron: "7 */3 * * *"
    - cron: "37 */3 * * *"
  workflow_dispatch: {}   # Actions 화면에서 「Run workflow」로 바로 돌려볼 수 있게
  push:                   # 수집기 코드를 고치면 바로 한 번 돌려 봄
    branches: [main]
    paths: ["collector/**", ".github/workflows/**"]

permissions:
  contents: write         # 수집한 데이터를 저장소에 커밋하려면 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 해석기 테스트
        run: python -m unittest discover -s collector
      - name: 수집
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python collector/collect.py
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "dongle-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data/raw; then
            echo "새 시세 없음"
          else
            git commit -m "시세 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git push
          fi
