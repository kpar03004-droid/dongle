# 디스코드 봇으로 시세를 가져오는 작업 (예비용)
#
# 지금은 상점알리미가 알림을 「게시(Publish)」하지 않아 팔로우 채널에 아무것도 오지 않으므로
# 실제 수집은 PC 유저스크립트(ingest.yml)가 맡는다. 동글랜드에서 게시를 켜 주면 이쪽도 바로 동작한다.
name: 시세 수집 (봇)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 */3 * * *"
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: save-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 해석기 테스트
        run: python -m unittest discover -s collector
      - name: 수집
        run: python collector/collect.py
      - name: 커밋
        run: |
          git config user.name "dongle-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git add data
            if git diff --cached --quiet -- data/raw; then echo "새 시세 없음"; break; fi
            git commit -q -m "시세 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            if git pull --rebase -q origin main && git push -q; then echo "저장 완료"; break; fi
            git rebase --abort 2>/dev/null || true
            git reset -q --hard origin/main
            python collector/collect.py
          done
